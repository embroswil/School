    <style>
      /* Ecran de demarrage affiche des la premiere image, avant le chargement de l'application */
      html, body { background: #07080b; }
      #demarrage { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #07080b; color: #fff; font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; transition: opacity 0.35s ease; }
      #demarrage .logo { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; margin-top: -8vh; }
      #demarrage .logo span { display: inline-block; width: 12px; height: 12px; margin-left: 4px; border-radius: 50%; background: #2f6bff; }
      #demarrage .devise { margin-top: 10px; color: #8c96aa; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #demarrage .barre { width: 120px; height: 3px; margin-top: 34px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      #demarrage .barre i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #2f6bff; animation: glisse 1.1s ease-in-out infinite; }
      #demarrage .signe { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); color: #5a6273; font-size: 12px; font-family: -apple-system, sans-serif; }
      #demarrage.fini { opacity: 0; pointer-events: none; }
      @keyframes glisse { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="demarrage" aria-hidden="true">
      <div class="logo">School<span></span></div>
      <div class="devise">La vie scolaire, simplement</div>
      <div class="barre"><i></i></div>
      <div class="signe">by Embroswil</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Installation : on garde l'evenement d'installation (il peut arriver avant l'application)
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__installSchool = e
        window.dispatchEvent(new Event('school-installable'))
      })
      // Application installable : enregistrement du service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}))
      }
    </script>
  </body>
