    <!-- Pas de reglage « apple-mobile-web-app-status-bar-style » : depuis iOS 26, le mode « black-translucent »
         fait dessiner par l'iPhone un voile flou par-dessus le haut de l'application (la bande qui s'eclaircit
         au lancement). Sans ce reglage, iOS peint la barre d'etat de la couleur de la page : l'application
         occupe tout l'ecran, d'un seul tenant. Pris en compte quand l'icone est ajoutee a l'ecran d'accueil. -->
    <meta name="description" content="Sùkûl : notes, absences, annonces et scolarité pour les parents, élèves, enseignants et établissements du Cameroun." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Couleur de la barre d'etat, fixee dans la page des le depart (aucun script ne la change pendant le
         lancement : chaque changement fait rejouer a l'iPhone une animation de la barre d'etat). -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07080b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa" />
    <script>
      // Theme choisi (clair ou sombre), pose avant l'affichage. Tant qu'aucun theme n'est choisi, l'application
      // suit le reglage du telephone, comme l'ecran de demarrage d'iOS : pas de passage du noir au blanc.
      ;(function () {
        try {
          var t = localStorage.getItem('sukul-theme')
          var clair = t === 'clair' || t === 'sombre' ? t === 'clair' : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var fond = clair ? '#f3f5fa' : '#07080b'
          var h = document.documentElement
          h.setAttribute('data-theme', clair ? 'light' : 'dark')
          // Application installee : ecran de demarrage aux couleurs du telephone, comme l'image de demarrage
          // d'iOS (qui suit toujours le reglage du telephone). Dans le navigateur, pas d'ecran de demarrage :
          // la page s'affiche directement dans les couleurs du theme, sans passage du noir au blanc.
          var installee = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          var ecranSombre = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var fondDemarrage = installee ? (ecranSombre ? '#07080b' : '#f3f5fa') : fond
          h.setAttribute('data-demarrage', installee ? (ecranSombre ? 'sombre' : 'clair') : 'aucun')
          h.style.background = fondDemarrage
          h.style.colorScheme = clair ? 'light' : 'dark'
          // Navigateur, theme choisi different du telephone : la barre prend la couleur du theme
          if (!installee && fond !== (ecranSombre ? '#07080b' : '#f3f5fa')) {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute('content', fond)
            })
          }
          // Couleurs gardees par l'iPhone quand l'icone est ajoutee a l'ecran d'accueil : fond de l'application
          // avant son premier affichage. Elles suivent le reglage du telephone, comme l'image de demarrage d'iOS.
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.querySelector('link[rel="manifest"]').setAttribute('href', '/manifest-sombre.webmanifest')
        } catch (e) {}
      })()
    </script>
    <title>Sùkûl – la vie scolaire, simplement</title>
    <style>
      /* Ecran de demarrage : un seul ecran fixe, identique au pixel pres a l'image de demarrage d'iOS
         (bloc de 260 px centre, signature Embroswil de 150 px a 90 % de la hauteur).
         Le logo et la signature sont dans la page : ils s'affichent en meme temps, sans chargement. */
      html, body { background: #07080b; margin: 0; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f3f5fa; }
      #demarrage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 9999; background: #07080b; transition: opacity 0.35s ease; }
      html[data-demarrage='clair'] #demarrage { background: #f3f5fa; }
      html[data-demarrage='aucun'] #demarrage { display: none; }
      #demarrage img.clair, html[data-demarrage='clair'] #demarrage img.sombre { display: none !important; }
      html[data-demarrage='clair'] #demarrage img.clair { display: block !important; }
      #demarrage .bloc { position: absolute; left: 50%; top: 50%; width: 260px; transform: translate(-50%, -50%); transition: opacity 0.2s ease; }
      #demarrage .bloc img { display: block; width: 260px; height: 84px; }
      #demarrage .signe { position: absolute; left: 50%; top: 90%; width: 150px; margin-left: -75px; transition: opacity 0.2s ease; }
      #demarrage .signe img { display: block; width: 150px; height: 21px; }
      /* Sortie : le logo s'efface sur le fond noir, puis l'application apparait */
      #demarrage.fini .bloc, #demarrage.fini .signe { opacity: 0; }
      #demarrage.parti { opacity: 0; pointer-events: none; }
    </style>
    <!-- Polices chargees sans bloquer le premier affichage : a l'ouverture de l'application installee,

    <script>
      // Le logo et la signature sont poses sur des pixels entiers, exactement comme dans l'image de
      // demarrage d'iOS. Application installee sur iPhone : la page commence sous la barre d'etat, alors
      // que l'image d'iOS couvre tout l'ecran ; on cale donc l'ecran de demarrage sur l'ecran entier,
      // pour que rien ne bouge d'un pixel entre l'image d'iOS et la page.
      ;(function () {
        var el = document.getElementById('demarrage')
        if (!el) return
        // Dans le navigateur : pas d'ecran de demarrage
        if (document.documentElement.getAttribute('data-demarrage') === 'aucun') return el.remove()
        var bloc = el.children[0]
        var signe = el.children[1]
        function caler() {
          if (!el.parentNode) return
          var d = window.screen.height - window.innerHeight
          if (window.navigator.standalone === true && d > 0 && d < 120) {
            el.style.top = -d + 'px'
            el.style.bottom = 'auto'
            el.style.height = window.screen.height + 'px'
          }
          var l = el.clientWidth
          var h = el.clientHeight
          bloc.style.transform = 'none'
          bloc.style.left = Math.floor((l - 260) / 2) + 'px'
          bloc.style.top = Math.floor((h - 84) / 2) + 'px'
          signe.style.marginLeft = '0'
          signe.style.left = Math.floor((l - 150) / 2) + 'px'
          signe.style.top = Math.floor(h * 0.9) + 'px'
        }
        caler()
        window.addEventListener('resize', caler)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Installation : on garde l'evenement d'installation (il peut arriver avant l'application)
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__installSchool = e
        window.dispatchEvent(new Event('school-installable'))
      })
      // Application installable : enregistrement du service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}))
      }
    </script>
